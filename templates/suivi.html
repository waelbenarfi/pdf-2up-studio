<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace technique Wael Academy</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/suivi.css">
<link rel="icon" type="image/svg+xml" href="/static/wael/emblem.svg">
</head>
<body class="suivi">

<div class="s-app">
  <aside class="s-barre">
    <a class="s-logo" href="#/tableau">
      <div class="s-logo-mark">
        <img src="/static/wael/emblem-white.svg" alt="Wael Academy" width="26">
      </div>
      <div>
        <strong>Espace technique</strong>
        <span>Wael Academy</span>
      </div>
    </a>
    <nav class="s-nav" id="nav"></nav>
    <div class="s-barre-pied">
      <a class="s-retour" href="/">&larr; Outil PDF 2-up</a>
    </div>
  </aside>

  <div class="s-main">
    <header class="s-haut">
      <div id="titrePage">
        <h1>Espace technique Wael Academy</h1>
        <p>Chargement&hellip;</p>
      </div>
      <div class="s-haut-actions" id="hautActions"></div>
    </header>
    <main class="s-contenu" id="vue">
      <div class="s-chargement"><span class="s-tourne"></span></div>
    </main>
  </div>
</div>

<div class="s-toasts" id="toasts"></div>
<div id="calques"></div>

<script>
  window.SUIVI = {{ constantes | tojson }};
  // Qui est connecté vient du serveur, jamais du navigateur : avant, chacun
  // se déclarait lui-même et pouvait signer à la place d'un autre.
  window.SUIVI_MOI = {{ moi | tojson }};
</script>
<script type="module" src="/static/suivi/app.js"></script>
</body>
</html>
